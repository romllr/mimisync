name: Windows portable ZIP (verified native executable)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/windows-portable.yml
      - scripts/security/publish-portable.ps1
      - scripts/package-windows.py
permissions:
  contents: read
jobs:
  portable:
    runs-on: windows-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Validate PowerShell syntax before expensive work
        shell: pwsh
        run: |
          Get-ChildItem scripts/security -Filter '*.ps1' | ForEach-Object {
            $tokens = $null; $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) { throw ($parseErrors | Out-String) }
          }
      - name: Enable and verify Defender protection
        shell: pwsh
        run: |
          # Refresh signatures and let cloud policy initialize before its connection test.
          Set-MpPreference -DisableRealtimeMonitoring $false
          Set-MpPreference -MAPSReporting Advanced -SubmitSamplesConsent SendSafeSamples -DisableBlockAtFirstSeen $false -DisableIOAVProtection $false -DisableScriptScanning $false
          Update-MpSignature
          Start-Sleep -Seconds 10
          ./scripts/security/enable-cloud-validation.ps1
      - uses: actions/checkout@v4
        with:
          ref: 961fe0ddad0ec5c3c9a422e181262bb457dacfbe
          path: native-source
          persist-credentials: false
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native-source/src-tauri -> target
          cache-on-failure: true
      - name: Check WSL error decoding on Windows
        shell: pwsh
        run: |
          rustc --test native-source/src-tauri/src/setup_protocol.rs -o protocol-tests.exe
          if ($LASTEXITCODE -ne 0) { throw 'Setup protocol tests did not compile.' }
          ./protocol-tests.exe
          if ($LASTEXITCODE -ne 0) { throw 'Setup protocol regression failed.' }
      - name: Build portable executable from the reviewed native source
        working-directory: native-source
        run: |
          npm ci
          npm run tauri -- build --features custom-protocol
      - run: npm ci
      - name: Package portable app with notices and checksums
        shell: pwsh
        run: python scripts/package-windows.py --exe native-source/src-tauri/target/release/mimisync.exe --output portable-output --name Mimisync-0.2.0-preview3-windows-x64-portable --cargo-registry "$env:USERPROFILE/.cargo/registry/src"
      - name: Scan and publish exact portable ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: ./scripts/security/publish-portable.ps1
      - name: Preserve JSON evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-portable-security-report
          path: scan-report/*.json
          if-no-files-found: warn
