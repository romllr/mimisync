name: Windows executable
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install frontend dependencies
        run: npm ci
      - name: Build native Windows installer
        run: npm run tauri -- build --features custom-protocol
      - uses: actions/upload-artifact@v4
        with:
          name: Mimisync-Windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
      - name: Publish installer on tagged releases
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          generate_release_notes: true
          files: src-tauri/target/release/bundle/nsis/*.exe
