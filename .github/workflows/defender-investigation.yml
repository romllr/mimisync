name: Defender investigation (no application execution)
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  defender:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Enable realtime protection for this isolated test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-MpPreference -DisableRealtimeMonitoring $false
          $status = Get-MpComputerStatus
          $status | Select-Object AMServiceEnabled,AntivirusEnabled,RealTimeProtectionEnabled
          if (-not $status.RealTimeProtectionEnabled) { throw 'Realtime protection is unavailable; do not treat this run as reproducing the client protection.' }
      - name: Recover the exact reported ZIP without executing it
        run: python scripts/security/stage-reported.py
      - name: Mark the sample as an Internet download without executing it
        shell: pwsh
        run: |
          Set-Content -LiteralPath scan-input/Mimisync-0.2.0-windows-x64-test.zip -Stream Zone.Identifier -Value "[ZoneTransfer]`r`nZoneId=3`r`nHostUrl=https://raw.githubusercontent.com/romllr/mimisync/refs/heads/main/downloads/Mimisync-0.2.0-windows-x64-test.zip"
      - name: Download the previously built native installer for comparison
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 38923658646 --repo romllr/mimisync --name Mimisync-Windows-installer --dir scan-input/native
      - name: Scan exact samples with Microsoft Defender
        if: always()
        shell: pwsh
        run: ./scripts/security/defender-scan.ps1 -Root scan-input -Report scan-report/defender.json -RequireRealtime
      - name: Preserve the report, never the executables
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: defender-investigation-report
          path: scan-report/*.json
          if-no-files-found: warn
